<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz Aniversário, Amandinah</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A little birthday story for Amanda.">
<style>
/* Layout: a phone story, the way a friend would make one. Full-screen photos, plain caption bars, system font, emoji confetti. One deliberate dark look. */
:root {
  --outer: #0D0B0B;
  --text: #FFFFFF;
  --caption: rgba(0, 0, 0, .55);
  --soft: rgba(255, 255, 255, .78);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--outer);
  color: var(--text);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
[hidden] { display: none !important; }
img { display: block; max-width: 100%; pointer-events: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid #FFFFFF; outline-offset: 3px; }

.app { height: 100%; display: grid; place-items: center; }
.stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: manipulation; }
@media (min-width: 640px) and (min-height: 560px) {
  .stage { width: auto; height: min(calc(100% - 40px), 880px); aspect-ratio: 9 / 16; border-radius: 16px; }
}
.blur { position: absolute; top: -40px; left: -40px; width: calc(100% + 80px); height: calc(100% + 80px); max-width: none; object-fit: cover; filter: blur(26px) brightness(.5) saturate(1.15); }

/* Opening */
.open { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; text-align: center; transition: opacity .45s ease; }
.open.bye { opacity: 0; }
.open-inner {
  position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.open-small { margin: 0; font-size: 15px; color: var(--soft); }
.open h1 { margin: 0; font-size: 40px; font-weight: 700; letter-spacing: -.01em; }
.gift {
  appearance: none; border: 0; background: none; cursor: pointer;
  width: 160px; height: 160px; margin-top: 18px;
  font-size: 112px; line-height: 160px;
  font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  animation: wiggle 1.8s ease-in-out infinite;
  transition: transform .35s ease, opacity .35s ease;
}
.open.bye .gift { transform: scale(1.6); opacity: 0; animation: none; }
@keyframes wiggle {
  0%, 60%, 100% { transform: rotate(0); }
  68% { transform: rotate(-9deg) scale(1.04); }
  76% { transform: rotate(8deg) scale(1.04); }
  84% { transform: rotate(-5deg); }
  92% { transform: rotate(3deg); }
}
.open-tap { margin: 6px 0 0; font-size: 15px; font-weight: 600; color: var(--soft); }

/* Story */
.story { position: absolute; inset: 0; }
.slide { position: absolute; inset: 0; margin: 0; opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility 0s linear .25s; }
.slide.on { opacity: 1; visibility: visible; transition: opacity .25s ease, visibility 0s; }
.slide > img:not(.blur) { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.slide figcaption {
  position: absolute; left: 0; right: 0; top: 64%;
  padding: 9px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background: var(--caption);
  text-align: center; font-size: 18px; font-weight: 500; line-height: 1.3;
}
.shade { position: absolute; left: 0; right: 0; top: 0; height: 120px; background: linear-gradient(rgba(0, 0, 0, .38), rgba(0, 0, 0, 0)); pointer-events: none; z-index: 4; }

.top {
  position: absolute; left: 0; right: 0; top: 0; z-index: 5; pointer-events: none;
  padding-top: 10px;
  padding-left: max(10px, env(safe-area-inset-left, 0px));
  padding-right: max(10px, env(safe-area-inset-right, 0px));
}
.bars { display: flex; gap: 4px; }
.bars i { flex: 1; height: 2.5px; border-radius: 2px; background: rgba(255, 255, 255, .38); overflow: hidden; }
.bars b { display: block; height: 100%; background: #FFFFFF; transform: scaleX(0); transform-origin: left; }
.who { display: flex; align-items: center; gap: 8px; margin-top: 10px; text-shadow: 0 1px 3px rgba(0, 0, 0, .4); }
.who img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; object-position: 50% 40%; box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .9); }
.who b { font-size: 14px; font-weight: 600; }
.who span { font-size: 13px; color: var(--soft); }

.msg-inner {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: center; gap: 18px;
  padding-top: 70px; padding-bottom: 40px;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
}
.msg-text { margin: 0; font-size: 25px; font-weight: 700; line-height: 1.38; letter-spacing: -.005em; text-shadow: 0 1px 8px rgba(0, 0, 0, .35); }
.from { margin: 0; font-size: 18px; font-weight: 600; color: var(--soft); }
.again {
  appearance: none; cursor: pointer; align-self: flex-start;
  margin-top: 10px; min-height: 44px; padding: 0 18px;
  border: 1.5px solid rgba(255, 255, 255, .7); border-radius: 999px; background: rgba(255, 255, 255, .08);
  font-size: 15px; font-weight: 600;
}

#fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }

@media (prefers-reduced-motion: reduce) {
  .gift { animation: none; }
  .open, .slide, .slide.on, .gift { transition-duration: .01s; }
}
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">

    <section class="open" id="open" aria-label="Birthday surprise">
      <img class="blur" src="photos/cover.jpg" alt="">
      <div class="open-inner">
        <p class="open-small">a little something for you</p>
        <h1>Amanda 💖</h1>
        <button class="gift" id="giftBtn" type="button" aria-label="Open your birthday surprise">🎁</button>
        <p class="open-tap">tap to open</p>
      </div>
    </section>

    <div class="story" id="story" hidden>
      <div class="slides">
        <figure class="slide">
          <img src="photos/swing.jpg" alt="Baby Amanda with curly hair in a colorful swing" style="object-position: 50% 45%;">
          <figcaption>where it all started 🥹</figcaption>
        </figure>
        <figure class="slide">
          <img src="photos/chupeta.jpg" alt="Little Amanda in a red jacket with a pacifier" style="object-position: 22% 50%;">
          <figcaption>the pacifier era 😂</figcaption>
        </figure>
        <figure class="slide">
          <img src="photos/cover.jpg" alt="Amanda today, selfie with long curly hair" style="object-position: 50% 45%;">
          <figcaption>and now 💖</figcaption>
        </figure>
        <figure class="slide">
          <img src="photos/balcony.jpg" alt="Amanda in a cap on a balcony" style="object-position: 30% 50%;">
          <figcaption>beach girl ☀️🏐</figcaption>
        </figure>
        <figure class="slide">
          <img src="photos/mirror.jpg" alt="Amanda taking a mirror selfie" style="object-position: 40% 50%;">
          <figcaption>always ready for the beach 🌊</figcaption>
        </figure>
        <section class="slide" aria-label="Message">
          <img class="blur" src="photos/cover.jpg" alt="">
          <div class="msg-inner">
            <p class="msg-text">Happy Birthday, Amanda! 🎉💖 Wishing the happiest birthday to the sweetest and cutest person! I honestly love chatting with you, I hope this year brings you all the happiness and sweet moments you deserve! ✨🎂</p>
            <p class="from">— Saud</p>
            <button class="again" id="again" type="button">watch again ↺</button>
          </div>
        </section>
      </div>
      <div class="shade"></div>
      <div class="top" aria-hidden="true">
        <div class="bars" id="bars"></div>
        <div class="who"><img src="photos/cover.jpg" alt=""><b>for amanda 💖</b><span>15 Oct</span></div>
      </div>
    </div>

    <canvas id="fx" aria-hidden="true"></canvas>
  </div>
</div>

<script>
(() => {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const stage = document.getElementById('stage');

  /* ---------- Emoji confetti ---------- */
  const fx = (() => {
    const cv = document.getElementById('fx');
    const ctx = cv.getContext('2d');
    const EMOJI = ['🎉', '💖', '✨', '🎂', '🎈', '💕'];
    const FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    let parts = [], running = false, W = 0, H = 0, last = 0;
    function size() {
      const r = stage.getBoundingClientRect();
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      W = r.width; H = r.height;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    const pick = () => EMOJI[Math.floor(Math.random() * EMOJI.length)];
    function run() { if (!running) { running = true; last = performance.now(); requestAnimationFrame(tick); } }
    function rain(n) {
      n = reduce ? 10 : (n || 36);
      for (let i = 0; i < n; i++) {
        parts.push({ x: Math.random() * W, y: -30 - Math.random() * H * 0.9, vx: (Math.random() - 0.5) * 20, vy: 120 + Math.random() * 150,
          g: 0, s: 20 + Math.random() * 18, e: pick(), r: (Math.random() - 0.5) * 0.6, vr: (Math.random() - 0.5) * 1.5, ph: Math.random() * 6 });
      }
      run();
    }
    function burst(x, y, n) {
      n = reduce ? 10 : (n || 34);
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, v = 220 + Math.random() * 380;
        parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 200, g: 700, s: 22 + Math.random() * 20, e: pick(),
          r: (Math.random() - 0.5) * 0.6, vr: (Math.random() - 0.5) * 3, ph: Math.random() * 6 });
      }
      run();
    }
    function tick(now) {
      const dt = Math.min(0.033, (now - last) / 1000); last = now;
      ctx.clearRect(0, 0, W, H);
      parts = parts.filter((p) => p.y < H + 60);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const p of parts) {
        p.vy += p.g * dt; p.ph += dt * 2;
        p.x += (p.vx + Math.sin(p.ph) * 18) * dt; p.y += p.vy * dt; p.r += p.vr * dt;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.font = p.s + 'px ' + FONT; ctx.fillText(p.e, 0, 0);
        ctx.restore();
      }
      if (parts.length) requestAnimationFrame(tick);
      else { running = false; ctx.clearRect(0, 0, W, H); }
    }
    if ('ResizeObserver' in window) new ResizeObserver(size).observe(stage);
    else window.addEventListener('resize', size);
    size();
    return { rain, burst };
  })();

  /* ---------- Story ---------- */
  const open = document.getElementById('open');
  const story = document.getElementById('story');
  const slides = [...story.querySelectorAll('.slide')];
  const barsEl = document.getElementById('bars');
  slides.forEach(() => { const i = document.createElement('i'); i.appendChild(document.createElement('b')); barsEl.appendChild(i); });
  const fills = [...barsEl.querySelectorAll('b')];
  const DUR = 5000;
  let cur = 0, prog = 0, paused = false, started = false, last = performance.now();
  const isLast = () => cur === slides.length - 1;

  function render() {
    fills.forEach((f, k) => {
      const v = k < cur ? 1 : k > cur ? 0 : (isLast() ? 1 : prog);
      f.style.transform = 'scaleX(' + v + ')';
    });
  }
  function show(i) {
    i = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach((s, k) => { s.classList.toggle('on', k === i); s.inert = k !== i; });
    const changed = i !== cur;
    cur = i; prog = 0; render();
    if (isLast() && changed) setTimeout(() => fx.rain(40), 200);
  }
  function loop(now) {
    const dt = now - last; last = now;
    if (started && !paused && !document.hidden && !isLast()) {
      prog += dt / DUR;
      if (prog >= 1) show(cur + 1); else render();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  let down = false, downAt = 0;
  story.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;
    down = true; downAt = performance.now(); paused = true;
  });
  function release(e) {
    if (!down) return;
    down = false; paused = false;
    if (e.type !== 'pointerup' || performance.now() - downAt > 260) return;
    const r = story.getBoundingClientRect();
    if (e.clientX - r.left < r.width * 0.3) show(cur - 1);
    else if (!isLast()) show(cur + 1);
  }
  story.addEventListener('pointerup', release);
  story.addEventListener('pointercancel', release);
  story.addEventListener('pointerleave', release);
  document.addEventListener('keydown', (e) => {
    if (story.hidden) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); show(cur + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); show(cur - 1); }
  });
  document.getElementById('again').addEventListener('click', () => show(0));

  document.getElementById('giftBtn').addEventListener('click', (e) => {
    if (open.classList.contains('bye')) return;
    const r = e.currentTarget.getBoundingClientRect(), s = stage.getBoundingClientRect();
    fx.burst(r.left - s.left + r.width / 2, r.top - s.top + r.height / 2, 40);
    open.classList.add('bye');
    story.hidden = false;
    slides.forEach((sl) => { sl.inert = true; });
    show(0);
    setTimeout(() => { open.hidden = true; started = true; last = performance.now(); }, reduce ? 50 : 450);
  });
})();
</script>
</body>
</html>
